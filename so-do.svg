<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840"><rect width="1200" height="840" fill="#14171d"/><g font-family="Arial,sans-serif"><text x="60" y="76" fill="#edaa64" font-size="16" letter-spacing="3">XANH ARCADE / GAMING EDITION 2.0</text><text x="60" y="130" fill="#f4f1eb" font-size="40" font-weight="bold">Sơ đồ sân chơi của Xanh</text><text x="60" y="170" fill="#a6adb9" font-size="18">Giao diện gaming · Hình ảnh chi tiết · Âm thanh bật / tắt</text><g stroke="#4a535f" stroke-width="2" fill="none"><path d="M600 280v45H230v40M600 325v40M600 325h370v40"/><path d="M600 525v75"/></g><rect x="380" y="215" width="440" height="65" rx="10" fill="#edaa64"/><text x="600" y="257" text-anchor="middle" fill="#211912" font-size="23" font-weight="bold">Trang chủ · Kho game · Hội bạn</text><g fill="#222933" stroke="#465160"><rect x="60" y="365" width="340" height="160" rx="12"/><rect x="430" y="365" width="340" height="160" rx="12"/><rect x="800" y="365" width="340" height="160" rx="12"/></g><g fill="#f4f1eb" font-size="23" font-weight="bold"><text x="85" y="407">Robot phiêu lưu</text><text x="455" y="407">Cờ caro</text><text x="825" y="407">Phá gạch quỹ đạo</text></g><g fill="#b8c1ce" font-size="17"><text x="85" y="450">Nhảy · Né đá · Thu thập xu</text><text x="85" y="483">Cảnh thành cổ · Kỷ lục cục bộ</text><text x="455" y="450">Cùng máy hoặc trực tuyến</text><text x="455" y="483">15 × 15 · Nối 5 quân để thắng</text><text x="825" y="450">3 mạng · 3 màn · Gạch nhiều lớp</text><text x="825" y="483">Cảnh quỹ đạo · Chuột / chạm</text></g><rect x="270" y="600" width="660" height="105" rx="12" fill="#243449" stroke="#607b9b"/><text x="600" y="640" text-anchor="middle" fill="#edf1f7" font-size="23">Máy chủ thời gian thực trên Render</text><text x="600" y="676" text-anchor="middle" fill="#bfcede" font-size="17">Mã phòng · Sẵn sàng · Kiểm tra lượt · Kết quả ván</text><text x="60" y="759" fill="#edaa64" font-size="17">Tiếp theo: Cờ vua · Lưu tài nguy